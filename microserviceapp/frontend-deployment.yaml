apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-api
  template:
    metadata:
      labels:
        app: frontend-api
    spec:
      containers:
        - name: frontend-api
          image: mjafferkhader/frontend-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
