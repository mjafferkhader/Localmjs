prometheus:
  image: prom/prometheus:v2.55.0
  replicas: 1
  port: 9090
  scrapeInterval: 15s
  retention: 7d
  service:
    type: NodePort
    nodeport: 30090

nodeExporter:
  image: quay.io/prometheus/node-exporter:v1.8.2
  port: 9100

kubeStateMetrics:
  enabled: true
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
  replicas: 1
  port: 8080