apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090


      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics


      {{- if .Values.kubeStateMetrics.enabled }}
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kubeStateMetrics.port }}
      {{- end }}

      {{- with .Values.prometheus.scrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
