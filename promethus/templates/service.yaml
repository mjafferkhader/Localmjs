apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: prometheus
spec:
  type: {{ .Values.service.type }}
  selector:
    app: prometheus
  ports:
    - name: web
      port: {{ .Values.service.port }}
      targetPort: web
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
